<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissors</title>
    <link rel="stylesheet" href="index1.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Stone Paper Scissors</h1>
        </header>

        <section class="choices">
            <div class="choice" id="stone">
                <img src="images/Shinchan stone.png" alt="Stone">
                <p>Stone</p>
            </div>

            <div class="choice" id="paper">
                <img src="images/Shinchan Paper.png" alt="Paper">
                <p>Paper</p>
            </div>

            <div class="choice" id="scissors">
                <img src="images/Shinchan Scissors.png" alt="Scissors">
                <p>Scissors</p>
            </div>
        </section>

        <section class="score-board">
            <div class="score">
                <h2 id="user-score">0</h2>
                <p>You</p>
            </div>

            <div class="vs">VS</div>

            <div class="score">
                <h2 id="comp-score">0</h2>
                <p>Computer</p>
            </div>
        </section>

        <div class="message-box">
            <p id="msg">Choose your move.</p>
        </div>

        <button id="reset">Reset Game</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
